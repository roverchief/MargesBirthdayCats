<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
html,body{margin:0;height:100%;background:#2b2140;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,12,35,.74);transition:opacity .35s;z-index:5}

.box{background:rgba(43,33,64,.95);border:2px solid #ffb86b;border-radius:28px;padding:18px 22px;margin:0 20px;text-align:center;max-width:340px;box-shadow:0 0 40px rgba(255,184,107,.35)}

#overlay.final h2{margin:4px 0 10px;line-height:1.05;font-size:clamp(30px,9.5vw,44px);text-shadow:none;
  background:linear-gradient(90deg,#ffd23f,#ff6fa5,#4cc3ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 12px rgba(255,170,40,.5))}
#overlay.final h2 b{display:block;font-size:clamp(54px,19vw,88px);letter-spacing:1px;margin-top:2px}

button:active{filter:brightness(.85)}
</style>
</head><body>
<canvas id="c"></canvas>
<canvas id="cf" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10"></canvas>
<div id="overlay"><div class="box"><div class="cakeart" id="cakeart"></div><h2 id="oh"></h2><p id="op"></p><ul id="rules"></ul><p id="lyric" style="min-height:1.4em;font-weight:700;color:#ffd23f;display:none"></p><button id="go">Start</button> <button id="song" style="display:none;background:#fff;margin-top:8px">🎵 Replay song</button></div></div>
<script>
const NAME = "Marge";         // birthday person
const WW = 360, HH = 640;     // logical size; scaled to fit the screen
const ROOM = {x: 12, y: 52, w: 336, h: 576};
const $ = id => document.getElementById(id);

// ---------- helpers: audio, stage, confetti ----------
let actx;
function beep(f, d = .06, t = "square", v = .08){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = t; o.frequency.value = f; g.gain.value = v;
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  }catch(_){}
}
function makeStage(cv){
  const ctx = cv.getContext("2d"); const st = {ctx, s: 1, ox: 0, oy: 0, dpr: 1};
  function resize(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    st.s = Math.min(innerWidth / WW, innerHeight / HH);
    st.ox = (innerWidth - WW * st.s) / 2; st.oy = (innerHeight - HH * st.s) / 2; st.dpr = dpr;
  }
  addEventListener("resize", resize); resize();
  st.begin = () => { ctx.setTransform(st.dpr, 0, 0, st.dpr, 0, 0); ctx.fillStyle = "#1c1430"; ctx.fillRect(0, 0, innerWidth, innerHeight);
    ctx.translate(st.ox, st.oy); ctx.scale(st.s, st.s); };
  st.pt = e => ({x: (e.clientX - st.ox) / st.s, y: (e.clientY - st.oy) / st.s});
  return st;
}
function confettiSys(){
  const list = [];
  return {
    burst(x, y, n = 40){ for (let i = 0; i < n; i++) list.push({x, y, vx: (Math.random() - .5) * 8, vy: -Math.random() * 8 - 2,
      c: ["#ff6fa5","#ffd23f","#4cc3ff","#d9f24a","#fff"][i % 5], r: Math.random() * 5, l: 80 + Math.random() * 40}); },
    draw(ctx){ for (let i = list.length - 1; i >= 0; i--){ const c = list[i];
      c.x += c.vx; c.y += c.vy; c.vy += .25; c.vx *= .99;
      ctx.globalAlpha = Math.max(0, Math.min(1, --c.l / 30)); ctx.fillStyle = c.c; ctx.fillRect(c.x, c.y, c.r + 2, c.r + 4);
      if (c.l <= 0) list.splice(i, 1); } ctx.globalAlpha = 1; }
  };
}
const CAKE_SVG = '<svg viewBox="0 0 120 100"><g><ellipse cx="22" cy="14" rx="3" ry="6" fill="#ffb02e"/><ellipse cx="41" cy="14" rx="3" ry="6" fill="#ffb02e"/><ellipse cx="60" cy="14" rx="3" ry="6" fill="#ffb02e"/><ellipse cx="79" cy="14" rx="3" ry="6" fill="#ffb02e"/><ellipse cx="98" cy="14" rx="3" ry="6" fill="#ffb02e"/>'
 + '<rect x="19" y="20" width="6" height="22" fill="#4cc3ff"/><rect x="38" y="20" width="6" height="22" fill="#ffd23f"/><rect x="57" y="20" width="6" height="22" fill="#ff6fa5"/><rect x="76" y="20" width="6" height="22" fill="#d9f24a"/><rect x="95" y="20" width="6" height="22" fill="#fff"/></g>'
 + '<rect x="8" y="42" width="104" height="44" rx="6" fill="#f4a6c8"/><rect x="8" y="42" width="104" height="10" fill="#fff"/><rect x="18" y="62" width="84" height="8" fill="#ffd23f"/><rect x="2" y="86" width="116" height="8" rx="3" fill="#b86a8f"/></svg>';


// ---------- the cats ----------
// kind = personality. collar = colour of the cat's basket.
const CATS = {
  mochi: {name: "Mochi", kind: "follow",  fur: "#f2a04a", mark: "#c9722a", belly: "#ffe3bd", collar: "#ff5a5f", eye: "#6fd16f", bio: "folgt dem Punkt direkt – am liebsten sofort."},
  zippy: {name: "Zippy", kind: "distract",fur: "#f6f1e8", mark: "#e08a3c", belly: "#ffffff", collar: "#d9f24a", eye: "#4cc3ff", bio: "folgt dir – bis ein Schmetterling vorbeifliegt. Sofort abgelenkt!"},
  boo:   {name: "Boo",   kind: "shy",     fur: "#3b3547", mark: "#26212f", belly: "#51495f", collar: "#ff6fa5", eye: "#ffd23f", bio: "ist schüchtern und rennt vor dem Punkt davon. Scheuche sie hin!"},
  ninja: {name: "Ninja", kind: "pounce",  fur: "#d8d2c4", mark: "#8c7b62", belly: "#f4efe4", collar: "#b388ff", eye: "#ff9f43", bio: "schleicht an und springt auf den Punkt – mit viel Schwung."},
  chonk: {name: "Chonk", kind: "lazy",    fur: "#f1d9b5", mark: "#e0a458", belly: "#fffaf0", collar: "#ffd23f", eye: "#6fd16f", bio: "ist faul und bewegt sich nur, wenn der Punkt ganz nah ist."},
  dash:  {name: "Dash",  kind: "slide",   fur: "#8b5e3c", mark: "#5a3a22", belly: "#d2b48c", collar: "#ff9f1c", eye: "#ffd23f", bio: "rutscht und flitzt über jedes Ziel hinaus. Bremsen? Nie gehört."},
  echo:  {name: "Echo",  kind: "echo",    fur: "#efe2cf", mark: "#5b4636", belly: "#fff5e6", collar: "#06d6a0", eye: "#4cc3ff", bio: "läuft dorthin, wo der Punkt vor einer Sekunde war."},
  nap:   {name: "Nap",   kind: "nap",     fur: "#c7b5e8", mark: "#9a85c4", belly: "#f3ecff", collar: "#7f5539", eye: "#ffd23f", bio: "jagt kurz und schläft dann mitten im Lauf ein."}
};


function rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function ell(ctx, x, y, rx, ry, col){ ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function rrc(ctx, x, y, w, h, r, fill){ rr(ctx, x, y, w, h, Math.min(r, w / 2, h / 2)); ctx.fillStyle = fill; ctx.fill(); }
function vgrad(ctx, y0, y1, a, b){ const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function rgrad(ctx, x, y, r0, r1, a, b){ const g = ctx.createRadialGradient(x, y, r0, x, y, r1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function local(ctx, x, y, w, h, fn){ ctx.save(); ctx.translate(x + w / 2, y + h / 2); let L = w, T = h; if (h > w + 1){ ctx.rotate(Math.PI / 2); L = h; T = w; } fn(L, T); ctx.restore(); }
function softShadow(ctx, x, y, w, h, r, lift = 0){
  for (let i = 5; i >= 1; i--){ ctx.fillStyle = "rgba(25,10,35," + (.07 + lift * .01) + ")"; rr(ctx, x + 2 - i + 1, y + 4 + lift - i + 1, w + 2 * i - 2, h + 2 * i - 2, r + i); ctx.fill(); }
}

const ease = x => { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); };
const pop = x => { x = clamp(x, 0, 1); return x < 1 ? 1 - Math.pow(1 - x, 3) * Math.cos(x * 9) : 1; };
function drawBigCake(ctx, x, y, s, t){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ell(ctx, 0, 30, 46, 12, "rgba(0,0,0,.25)"); ell(ctx, 0, 24, 44, 11, "#f3ece0"); ell(ctx, 0, 22, 40, 9, "#fff");
  rrc(ctx, -34, 0, 68, 24, 7, "#f4a6c8"); ctx.fillStyle = "#e88fb5"; ctx.fillRect(-34, 14, 68, 3);
  ell(ctx, 0, 0, 34, 8, "#ffd6e8");
  ctx.fillStyle = "#fff"; for (let i = -3; i <= 3; i++){ ctx.beginPath(); ctx.arc(i * 10, 1, 5.2, 0, Math.PI); ctx.fill(); }
  rrc(ctx, -22, -18, 44, 20, 6, "#fff1c9"); ell(ctx, 0, -18, 22, 6, "#fff8e3");
  ctx.fillStyle = "#ff6fa5"; for (let i = -2; i <= 2; i++){ ctx.beginPath(); ctx.arc(i * 8, -16, 4.2, 0, Math.PI); ctx.fill(); }
  for (const [cx2, col] of [[-14, "#4cc3ff"], [-7, "#ffd23f"], [0, "#ff6fa5"], [7, "#d9f24a"], [14, "#b388ff"]]){
    rrc(ctx, cx2 - 2, -34, 4, 16, 1.5, col);
    const f = 1 + Math.sin(t * 12 + cx2) * .12;
    ctx.fillStyle = rgrad(ctx, cx2, -42, 0, 11, "rgba(255,220,120,.55)", "rgba(255,200,80,0)"); ctx.beginPath(); ctx.arc(cx2, -42, 11, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffb02e"; ctx.beginPath(); ctx.ellipse(cx2, -41, 2.6 * f, 5.6 * f, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff3a8"; ctx.beginPath(); ctx.ellipse(cx2, -40, 1.2, 3, 0, 0, 7); ctx.fill();
  }
  ctx.fillStyle = "#e0234e"; ctx.beginPath(); ctx.arc(0, -19, 0, 0, 7); ctx.fill();
  ctx.restore();
}


// ---------- a cat seen from the side ----------
// Local coordinates: origin = floor below the cat, cat faces +x, about 100 units tall.
// mood: "wait" | "drink" | "happy". amt = 0..1 head bow while drinking.
function drawCatSide(ctx, o){
  const d = CATS[o.id], t = o.t || 0, mood = o.mood || "wait", s = o.s || 1, flip = o.flip ? -1 : 1, ph = o.ph || 0;
  const fat = o.id === "chonk" ? 1.22 : 1, bow = mood === "drink" ? o.bow : 0;
  const hop = mood === "happy" ? -Math.abs(Math.sin(t * 6 + ph)) * 6 : 0;
  ctx.save(); ctx.translate(o.x, o.y); ctx.scale(s * flip, s);
  ell(ctx, 0, 1, 34 * fat, 6, "rgba(20,8,30,.3)");
  ctx.translate(0, hop);
  const OL = "rgba(35,18,45,.45)";
  const fill = (col, stroke = true) => { ctx.fillStyle = col; ctx.fill(); if (stroke){ ctx.strokeStyle = OL; ctx.lineWidth = 1.4; ctx.stroke(); } };
  // tail
  const sw = mood === "happy" ? Math.sin(t * 7 + ph) * 8 : Math.sin(t * 2.2 + ph) * 6;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(-26 * fat, -14); ctx.bezierCurveTo(-52 * fat, -8, -56 * fat + sw, -40, -44 * fat + sw * 1.2, mood === "happy" ? -78 : -62 + sw * .3);
  ctx.strokeStyle = OL; ctx.lineWidth = 12; ctx.stroke(); ctx.strokeStyle = d.fur; ctx.lineWidth = 9.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-50 * fat + sw * .8, -50); ctx.lineTo(-44 * fat + sw * 1.2, mood === "happy" ? -78 : -62 + sw * .3); ctx.strokeStyle = d.mark; ctx.lineWidth = 9.5; ctx.stroke();
  // hind leg + haunch + body
  ctx.beginPath(); ctx.ellipse(-8 * fat, -19, 25 * fat, 19, 0, 0, 7); fill(d.fur);
  ctx.beginPath(); ctx.ellipse(0, -34, 22 * fat, 30, .12, 0, 7); fill(d.fur);
  ctx.beginPath(); ctx.ellipse(-6 * fat, -5, 14, 6, 0, 0, 7); fill(d.belly);       // hind paw
  ctx.beginPath(); ctx.ellipse(13, -28, 9, 20, .05, 0, 7); fill(d.belly, false);    // chest
  // markings
  ctx.fillStyle = d.mark; ctx.strokeStyle = d.mark; ctx.lineWidth = 3; ctx.lineCap = "round";
  if (o.id === "mochi" || o.id === "dash" || o.id === "nap"){ for (const [x1, y1] of [[-16, -42], [-10, -32], [-18, -26]]){ ctx.beginPath(); ctx.moveTo(x1 * fat, y1); ctx.lineTo(x1 * fat + 12, y1 + 2); ctx.stroke(); } }
  if (o.id === "zippy"){ ctx.beginPath(); ctx.ellipse(-8 * fat, -44, 11, 9, .4, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(-14 * fat, -18, 8, 6, 0, 0, 7); ctx.fillStyle = "#444"; ctx.fill(); }
  // front leg
  ctx.beginPath(); rr(ctx, 8, -30, 11, 29, 5); fill(d.fur);
  ctx.beginPath(); ctx.ellipse(15, -2, 9, 4.5, 0, 0, 7); fill(d.belly);
  if (o.id === "ninja" || o.id === "echo"){ ctx.beginPath(); ctx.ellipse(15, -2, 9, 4.5, 0, 0, 7); fill(d.mark); }
  // head (pivots at the neck)
  ctx.save(); ctx.translate(12, -54 + bow * 6); ctx.rotate(bow * .55);
  const hx = 3, hy = -14;
  // ears
  for (const [ax, ay, bx, by, cx, cy] of [[-9, -18, -6, -38, 6, -22], [5, -22, 18, -38, 20, -16]]){
    ctx.beginPath(); ctx.moveTo(ax + hx, ay + hy + 12); ctx.lineTo(bx + hx, by + hy + 12); ctx.lineTo(cx + hx, cy + hy + 12); ctx.closePath(); fill(d.fur);
    ctx.beginPath(); ctx.moveTo(ax + hx + 3, ay + hy + 10); ctx.lineTo(bx + hx + 1.5, by + hy + 16); ctx.lineTo(cx + hx - 3, cy + hy + 10); ctx.closePath(); ctx.fillStyle = (o.id === "ninja" || o.id === "echo") ? d.mark : "#ffadc7"; ctx.fill();
  }
  ctx.beginPath(); ctx.ellipse(hx, hy, 19 * (fat > 1 ? 1.1 : 1), 16, 0, 0, 7); fill(d.fur);
  if (o.id === "ninja" || o.id === "echo"){ ctx.beginPath(); ctx.ellipse(hx + 9, hy + 5, 11, 9, 0, 0, 7); ctx.fillStyle = d.mark; ctx.globalAlpha = .75; ctx.fill(); ctx.globalAlpha = 1; }
  if (o.id === "mochi"){ ctx.strokeStyle = d.mark; ctx.lineWidth = 2.5; for (const dx of [-4, 3, 10]){ ctx.beginPath(); ctx.moveTo(hx + dx, hy - 15); ctx.lineTo(hx + dx, hy - 8); ctx.stroke(); } }
  if (o.id === "zippy"){ ctx.beginPath(); ctx.ellipse(hx - 6, hy - 7, 8, 7, .3, 0, 7); ctx.fillStyle = d.mark; ctx.fill(); }
  ctx.beginPath(); ctx.ellipse(hx + 11, hy + 5, 8, 6, 0, 0, 7); ctx.fillStyle = d.belly; ctx.fill();   // muzzle
  // eye
  const blink = (Math.sin(t * .9 + ph * 3) > .985) || mood === "happy";
  const ex = hx + 8, ey = hy - 2;
  if (blink){ ctx.strokeStyle = "#222"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ex, ey + (mood === "happy" ? 2 : 0), 4, mood === "happy" ? Math.PI : 0, mood === "happy" ? 0 : Math.PI, mood !== "happy"); ctx.stroke(); }
  else { ell(ctx, ex, ey, 4.6, 5.2, d.eye); ctx.beginPath(); ctx.ellipse(ex + .8, ey, 1.7, 4.2, 0, 0, 7); ctx.fillStyle = "#111"; ctx.fill(); ell(ctx, ex + 1.6, ey - 2, 1.3, 1.3, "#fff"); }
  ell(ctx, hx - 2, hy - 2, 3, 4, "rgba(0,0,0,0)");
  // nose, mouth, whiskers
  ctx.beginPath(); ctx.moveTo(hx + 17, hy + 1); ctx.lineTo(hx + 22, hy + 2); ctx.lineTo(hx + 18.5, hy + 5); ctx.closePath(); ctx.fillStyle = "#ff8fb0"; ctx.fill();
  ctx.strokeStyle = "#333"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(hx + 18.5, hy + 5); ctx.quadraticCurveTo(hx + 17, hy + 10, hx + 12, hy + 9); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 1; ctx.beginPath(); for (const w of [-3, 1, 5]){ ctx.moveTo(hx + 15, hy + 6 + w * .3); ctx.lineTo(hx + 30, hy + 3 + w); } ctx.stroke();
  // party hat
  if (o.hat){ ctx.save(); ctx.translate(hx - 1, hy - 13); ctx.rotate(-.18); ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.lineTo(0, -26); ctx.closePath(); ctx.fillStyle = o.hat; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-6, -7); ctx.lineTo(6, -11); ctx.moveTo(-3, -15); ctx.lineTo(3, -17); ctx.stroke(); ell(ctx, 0, -27, 3.4, 3.4, "#fff"); ctx.restore(); }
  ctx.restore();
  if (mood === "happy"){ for (let i = 0; i < 2; i++){ const a = (t * .9 + i * .5 + ph) % 1; ctx.globalAlpha = 1 - a; ctx.font = "14px sans-serif"; ctx.textAlign = "center"; ctx.fillText("❤️", 30 + i * 12, -90 - a * 30); } ctx.globalAlpha = 1; }
  ctx.restore();
}

// ---------- pipes ----------
const N_ = 1, E_ = 2, S_ = 4, W_ = 8;
const DIRS = [[N_, -1, 0, S_], [E_, 0, 1, W_], [S_, 1, 0, N_], [W_, 0, -1, E_]];   // bit, dr, dc, opposite
const rot = m => ((m << 1) | (m >> 3)) & 15;
const rotN = (m, k) => { for (let i = 0; i < k; i++) m = rot(m); return m; };
const BASES = {straight: N_ | S_, corner: N_ | E_, tee: N_ | E_ | W_};
const LEVELS = [{R: 3, C: 3}, {R: 4, C: 3}, {R: 4, C: 4}];
const HEROES = ["mochi", "zippy", "ninja", "chonk", "boo"];
const HATS = ["#ff6fa5", "#4cc3ff", "#ffd23f", "#d9f24a", "#b388ff", "#ff9f43", "#06d6a0", "#ff5a5f"];

function makeLevel(L, seed){
  for (let attempt = 0; ; attempt++){
    const rnd = rng(seed * 131 + attempt * 7 + 5), R = L.R, C = L.C;
    const a = (rnd() * C) | 0, b = (rnd() * C) | 0, seen = new Set(), path = [[0, a]]; seen.add("0," + a);
    const minLen = R + Math.abs(a - b) + 2;
    const dfs = () => {
      const [r, c] = path[path.length - 1];
      if (r === R - 1 && c === b) return path.length >= minLen;
      if (path.length > R + C + 3) return false;
      const order = DIRS.slice().sort(() => rnd() - .5);
      for (const [, dr, dc] of order){
        const nr = r + dr, nc = c + dc, k = nr + "," + nc;
        if (nr < 0 || nc < 0 || nr >= R || nc >= C || seen.has(k)) continue;
        seen.add(k); path.push([nr, nc]); if (dfs()) return true; path.pop(); seen.delete(k);
      }
      return false;
    };
    if (!dfs()) continue;
    const tiles = []; for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) tiles.push({base: 0, rot: 0, ang: 0, wet: 0, path: false});
    path.forEach(([r, c], i) => {
      const prev = i ? path[i - 1] : [-1, c], next = i < path.length - 1 ? path[i + 1] : [R, c];
      const need = DIRS.find(d => prev[0] === r + d[1] && prev[1] === c + d[2])[0] | DIRS.find(d => next[0] === r + d[1] && next[1] === c + d[2])[0];
